<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, query, orderBy, onSnapshot, serverTimestamp, getDoc, setDoc, collectionGroup } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

// ВСТАВЬТЕ СЮДА КЛЮЧИ ОТ НОВОГО ПРОЕКТА FIREBASE
const firebaseConfig = {
  apiKey: "ВАШ_API_KEY",
  authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
  projectId: "ВАШ_ПРОЕКТ",
  storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
  messagingSenderId: "ВАШ_ID",
  appId: "ВАШ_APP_ID"
};

const ADMIN_EMAIL = 'atelier.rose@mail.ru';
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function toast(msg, type='') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast ' + type, 3200);
}

const pages = {
  home: $('#page-home'), gallery: $('#page-gallery'), ready: $('#page-ready'), order: $('#page-order'),
  delivery: $('#page-delivery'), care: $('#page-care'), chat: $('#page-chat'), admin: $('#page-admin'),
  privacy: $('#page-privacy'), thanks: $('#page-thanks')
};

function showPage(name, anchor) {
  closeMobileMenu();
  Object.values(pages).forEach(p => p && p.classList.remove('active'));
  const current = pages[name] || pages.home;
  current.classList.add('active');
  $$('nav a[data-nav], .mobile-menu a[data-nav]').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + name);
  });
  const html = document.documentElement;
  const prev = html.style.scrollBehavior;
  html.style.scrollBehavior = 'auto';
  let target = null;
  if (name === 'home' && anchor && anchor !== '#home' && anchor.length > 1) {
    try { target = document.querySelector(anchor); } catch(e){}
  }
  if (target) target.scrollIntoView({behavior:'auto', block:'start'});
  else window.scrollTo(0,0);
  setTimeout(()=>{ html.style.scrollBehavior = prev || ''; }, 20);
  current.querySelectorAll('.reveal').forEach(el => el.classList.remove('in'));
  observeReveals();
  const chatView = document.getElementById('adminChatView');
  if (chatView) chatView.classList.remove('mobile-open');
}

function route() {
  const h = window.location.hash || '';
  if (h === '#gallery') showPage('gallery');
  else if (h === '#ready') showPage('ready');
  else if (h === '#order') showPage('order');
  else if (h === '#delivery') showPage('delivery');
  else if (h === '#care') showPage('care');
  else if (h === '#chat') showPage('chat');
  else if (h === '#privacy') showPage('privacy');
  else if (h === '#thanks') showPage('thanks');
  else if (h === '#admin') {
    if (currentUser && currentUser.email === ADMIN_EMAIL) showPage('admin');
    else { toast('Доступ только для админа', 'error'); showPage('home'); }
  }
  else showPage('home', h);
}
window.addEventListener('hashchange', route);

const menuToggle = $('#menuToggle'), mobileMenu = $('#mobileMenu');
function closeMobileMenu() {
  if (menuToggle) menuToggle.classList.remove('open');
  if (mobileMenu) mobileMenu.classList.remove('open');
  document.body.style.overflow = '';
}
menuToggle.addEventListener('click', () => {
  const open = mobileMenu.classList.toggle('open');
  menuToggle.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
});
mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMobileMenu));

const authModal = $('#authModal');
function openAuth(tab='login') {
  authModal.classList.add('open');
  $$('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  $$('.auth-form').forEach(f => f.classList.remove('active'));
  $(tab === 'login' ? '#loginForm' : '#registerForm').classList.add('active');
}
function closeAuth() { authModal.classList.remove('open'); }

$('#loginBtn')?.addEventListener('click', () => openAuth('login'));
$('#mobileLoginBtn')?.addEventListener('click', () => { closeMobileMenu(); openAuth('login'); });
$('#chatLoginBtn')?.addEventListener('click', () => openAuth('login'));
$('#orderAuthBtn')?.addEventListener('click', () => openAuth('login'));
$('#modalClose').addEventListener('click', closeAuth);
authModal.addEventListener('click', e => { if (e.target === authModal) closeAuth(); });
$$('.auth-tab').forEach(tab => tab.addEventListener('click', () => {
  $$('.auth-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  $$('.auth-form').forEach(f => f.classList.remove('active'));
  $(tab.dataset.tab === 'login' ? '#loginForm' : '#registerForm').classList.add('active');
}));

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginSubmit'), msg = $('#loginMsg');
  btn.disabled = true; btn.textContent = 'Вход...';
  msg.textContent = ''; msg.className = 'auth-msg';
  try {
    await signInWithEmailAndPassword(auth, $('#loginEmail').value.trim(), $('#loginPassword').value);
    msg.textContent = 'Успешно!'; msg.className = 'auth-msg success';
    setTimeout(() => { closeAuth(); $('#loginForm').reset(); }, 700);
  } catch (err) {
    const m = err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' ? 'Неверный email или пароль'
      : err.code === 'auth/user-not-found' ? 'Пользователь не найден. Зарегистрируйтесь.'
      : err.code === 'auth/too-many-requests' ? 'Слишком много попыток. Попробуйте позже.'
      : 'Ошибка: ' + err.message;
    msg.textContent = m; msg.className = 'auth-msg error';
  } finally { btn.disabled = false; btn.textContent = 'Войти'; }
});

$('#registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#regSubmit'), msg = $('#regMsg');
  btn.disabled = true; btn.textContent = 'Создаём...';
  msg.textContent = ''; msg.className = 'auth-msg';
  try {
    const userCred = await createUserWithEmailAndPassword(auth, $('#regEmail').value.trim(), $('#regPassword').value);
    const name = $('#regName').value.trim();
    const city = $('#regCity').value.trim();
    await updateProfile(userCred.user, { displayName: name });
    await setDoc(doc(db, 'users', userCred.user.uid), {
      name, city, email: userCred.user.email, createdAt: serverTimestamp()
    });
    msg.textContent = 'Аккаунт создан!'; msg.className = 'auth-msg success';
    setTimeout(() => { closeAuth(); $('#registerForm').reset(); }, 700);
  } catch (err) {
    const m = err.code === 'auth/email-already-in-use' ? 'Этот email уже зарегистрирован'
      : err.code === 'auth/weak-password' ? 'Пароль слишком короткий (мин. 6)'
      : err.code === 'auth/invalid-email' ? 'Некорректный email'
      : 'Ошибка: ' + err.message;
    msg.textContent = m; msg.className = 'auth-msg error';
  } finally { btn.disabled = false; btn.textContent = 'Зарегистрироваться'; }
});

$('#logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
  $('#userDropdown').classList.remove('open');
  toast('Вы вышли из аккаунта');
});

let currentUser = null;
let isAdmin = false;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  isAdmin = user && user.email === ADMIN_EMAIL;
  
  const orderForm = $('#orderForm');
  const orderAuthNotice = $('#orderAuthNotice');
  if (orderForm && orderAuthNotice) {
    if (user) {
      orderForm.style.display = 'block';
      orderAuthNotice.style.display = 'none';
    } else {
      orderForm.style.display = 'none';
      orderAuthNotice.style.display = 'block';
    }
  }

  const nav = $('#navActions');
  const dropdown = $('#userDropdown');
  if($('#navAdminLi')) $('#navAdminLi').style.display = isAdmin ? 'block' : 'none';
  if($('#navAdminLiMobile')) $('#navAdminLiMobile').style.display = isAdmin ? 'block' : 'none';
  if($('#ddAdmin')) $('#ddAdmin').style.display = isAdmin ? 'flex' : 'none';
  if (user) {
    const name = user.displayName || user.email.split('@')[0];
    const initial = name.charAt(0).toUpperCase();
    nav.innerHTML = `
      <a href="#order" class="nav-cta">Заказать</a>
      <div class="user-chip" id="userChip"><div class="ava">${initial}</div><span class="name">${name}</span></div>
    `;
    $('#ddName').textContent = name + (isAdmin ? ' 👑' : '');
    $('#ddEmail').textContent = user.email;
    $('#userChip').addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.toggle('open');
    });
    $('#mobileLoginBtn').textContent = '👤 ' + name;
    $('#mobileLoginBtn').onclick = () => { closeMobileMenu(); $('#userDropdown').classList.toggle('open'); };
    renderChat();
    updateReviewButton(true);
    if (isAdmin) loadAdminPanel();
  } else {
    nav.innerHTML = `<a href="#order" class="nav-cta">Заказать</a><button class="btn-auth" id="loginBtn">Войти</button>`;
    $('#loginBtn').addEventListener('click', () => openAuth('login'));
    $('#mobileLoginBtn').textContent = 'Войти / Регистрация';
    $('#mobileLoginBtn').onclick = () => { closeMobileMenu(); openAuth('login'); };
    renderChat();
    updateReviewButton(false);
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.user-dropdown') && !e.target.closest('.user-chip')) {
    $('#userDropdown')?.classList.remove('open');
  }
});

let allBouquets = [];
function renderReadyBouquets() {
  const homeGrid = $('#readyGrid');
  const fullGrid = $('#readyGridFull');
  if (!homeGrid && !fullGrid) return;

  if (allBouquets.length === 0) {
    const emptyHtml = `
      <div class="ready-empty" style="grid-column:1/-1;">
        <span class="emoji">🌷</span>
        <h3>Готовых букетов пока нет</h3>
        <p>Все букеты создаются на заказ — свяжитесь с нами, и мы соберём букет специально для вас. А как только появятся готовые работы — они появятся здесь.</p>
        <a href="#order" class="btn btn-primary" data-nav>Заказать букет →</a>
      </div>`;
    if (homeGrid) homeGrid.innerHTML = emptyHtml;
    if (fullGrid) fullGrid.innerHTML = emptyHtml;
    return;
  }

  const html = allBouquets.map(b => {
    const title = (b.title || '').replace(/</g,'&lt;');
    const desc = (b.desc || '').replace(/</g,'&lt;');
    const master = (b.master || 'Ярослав').replace(/</g,'&lt;');
    const price = (b.price || '').replace(/</g,'&lt;');
    const photo = b.photo || '';
    return `<div class="ready-card reveal in">
      <div class="ready-img">
        ${photo ? `<img src="${photo}" alt="${title}" loading="lazy" onerror="this.style.opacity=.3">` : ''}
        <span class="ready-master">🌹 ${master}</span>
      </div>
      <div class="ready-body">
        <h3>${title}</h3>
        <div class="desc">${desc}</div>
        <div class="ready-foot">
          <div class="ready-price">${price} ₽<small>предоплата 50%</small></div>
          <a href="#order" class="ready-buy" data-nav>Заказать</a>
        </div>
      </div>
    </div>`;
  }).join('');

  if (homeGrid) homeGrid.innerHTML = html;
  if (fullGrid) fullGrid.innerHTML = html;
}

function renderAdminBouquets() {
  const grid = $('#adminBouquetsGrid');
  if (!grid) return;
  if (allBouquets.length === 0) {
    grid.innerHTML = '<div class="admin-empty">Пока нет готовых букетов. Добавьте первый!</div>';
    return;
  }
  grid.innerHTML = allBouquets.map(b => `
    <div class="bouquet-admin-card" data-id="${b.id}">
      <div class="img-wrap">
        ${b.photo ? `<img src="${b.photo}" alt="${(b.title||'').replace(/</g,'&lt;')}" loading="lazy" onerror="this.style.opacity=.3">` : ''}
        <span class="master-tag">${(b.master || 'Ярослав').replace(/</g,'&lt;')}</span>
      </div>
      <div class="info">
        <h4>${(b.title || '').replace(/</g,'&lt;')}</h4>
        <div class="desc">${(b.desc || '').replace(/</g,'&lt;')}</div>
        <div class="price">${(b.price || '').replace(/</g,'&lt;')} ₽</div>
        <div class="actions">
          <button class="edit" data-action="edit" data-id="${b.id}">✎ Изменить</button>
          <button class="del" data-action="del" data-id="${b.id}">🗑 Удалить</button>
        </div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (btn.dataset.action === 'edit') editBouquet(id);
      else if (btn.dataset.action === 'del') deleteBouquet(id);
    });
  });
}

onSnapshot(query(collection(db, 'bouquets'), orderBy('createdAt', 'desc')), (snap) => {
  allBouquets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderReadyBouquets();
  renderAdminBouquets();
  if ($('#statBouquets')) $('#statBouquets').textContent = allBouquets.length;
}, (err) => {
  console.error('Bouquets load error:', err);
});

function openBouquetForm(bouquet) {
  const wrapper = $('#bouquetFormWrapper');
  wrapper.classList.add('open');
  $('#bouquetFormTitle').textContent = bouquet ? 'Редактировать букет' : 'Новый букет';
  $('#bouquetId').value = bouquet ? bouquet.id : '';
  $('#bouquetTitle').value = bouquet ? (bouquet.title || '') : '';
  $('#bouquetPrice').value = bouquet ? (bouquet.price || '') : '';
  $('#bouquetMaster').value = bouquet ? (bouquet.master || 'Ярослав') : 'Ярослав';
  $('#bouquetPhoto').value = bouquet ? (bouquet.photo || '') : '';
  $('#bouquetDesc').value = bouquet ? (bouquet.desc || '') : '';
  updateBouquetPreview();
  wrapper.scrollIntoView({behavior:'smooth', block:'start'});
}

function closeBouquetForm() {
  $('#bouquetFormWrapper').classList.remove('open');
  $('#bouquetForm').reset();
  $('#bouquetId').value = '';
}

function updateBouquetPreview() {
  const url = $('#bouquetPhoto').value.trim();
  const box = $('#bouquetPreview');
  const img = $('#bouquetPreviewImg');
  if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
    img.src = url;
    box.classList.add('show');
  } else {
    box.classList.remove('show');
    img.src = '';
  }
}

function editBouquet(id) {
  const b = allBouquets.find(x => x.id === id);
  if (b) openBouquetForm(b);
}

async function deleteBouquet(id) {
  if (!confirm('Удалить этот букет?')) return;
  try {
    await deleteDoc(doc(db, 'bouquets', id));
    toast('Букет удалён', 'success');
  } catch (err) { toast('Ошибка: ' + err.message, 'error'); }
}

$('#addBouquetBtn')?.addEventListener('click', () => openBouquetForm(null));
$('#bouquetCancelBtn')?.addEventListener('click', closeBouquetForm);
$('#bouquetPhoto')?.addEventListener('input', updateBouquetPreview);

$('#bouquetForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#bouquetSubmitBtn');
  btn.disabled = true; btn.textContent = 'Сохраняю...';
  const id = $('#bouquetId').value;
  const data = {
    title: $('#bouquetTitle').value.trim(),
    price: $('#bouquetPrice').value.trim(),
    master: $('#bouquetMaster').value,
    photo: $('#bouquetPhoto').value.trim(),
    desc: $('#bouquetDesc').value.trim()
  };
  try {
    if (id) {
      await updateDoc(doc(db, 'bouquets', id), data);
      toast('Букет обновлён', 'success');
    } else {
      await addDoc(collection(db, 'bouquets'), { ...data, createdAt: serverTimestamp() });
      toast('Букет добавлен', 'success');
    }
    closeBouquetForm();
  } catch (err) {
    toast('Ошибка: ' + err.message, 'error');
  } finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
});

const revGrid = $('#revGrid');
let allReviews = [];
function starsHtml(n) { return '★'.repeat(n) + '☆'.repeat(5-n); }
function initials(name) { return name ? name.charAt(0).toUpperCase() : '?'; }

function renderReviews() {
  if (!revGrid) return;
  if (allReviews.length === 0) {
    revGrid.innerHTML = '<div class="rev-empty">Пока нет отзывов. Будьте первым — оставьте свой!</div>';
    return;
  }
  revGrid.innerHTML = allReviews.map(r => {
    const canDelete = isAdmin; 
    const name = r.userName || 'Клиент';
    const text = (r.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const photoHtml = r.photoUrl ? `<img src="${r.photoUrl}" class="rev-photo" alt="Фото отзыва" loading="lazy">` : '';
    return `<div class="rev reveal in ${canDelete ? 'rev-owner' : ''}" data-id="${r.id}">
      ${canDelete ? '<button class="rev-del" title="Удалить">✕</button>' : ''}
      <div class="rev-stars">${starsHtml(r.rating || 5)}</div>
      ${photoHtml}
      <p>${text}</p>
      <div class="rev-author"><div class="rev-ava">${initials(name)}</div><div><b>${name}</b><span>${(r.userCity || 'Пермский край')}</span></div></div>
    </div>`;
  }).join('');
  revGrid.querySelectorAll('.rev-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.closest('.rev').dataset.id;
      if (!confirm('Удалить этот отзыв?')) return;
      try {
        await deleteDoc(doc(db, 'reviews', id));
        toast('Отзыв удалён', 'success');
      } catch (err) { toast('Не удалось удалить: ' + err.message, 'error'); }
    });
  });
}

onSnapshot(query(collection(db, 'reviews'), orderBy('createdAt', 'desc')), (snap) => {
  allReviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderReviews();
  if ($('#statReviews')) $('#statReviews').textContent = allReviews.length;
  if (isAdmin && typeof renderAdminReviews === 'function') renderAdminReviews();
}, (err) => {
  console.error(err);
  if (revGrid) revGrid.innerHTML = '<div class="rev-empty">Не удалось загрузить отзывы.</div>';
});

let selectedStars = 5;
const starsPicker = $('#starsPicker');
if (starsPicker) {
  starsPicker.querySelectorAll('span').forEach(s => {
    s.addEventListener('click', () => {
      selectedStars = +s.dataset.star;
      starsPicker.querySelectorAll('span').forEach(x => x.classList.toggle('active', +x.dataset.star <= selectedStars));
    });
  });
  starsPicker.querySelectorAll('span').forEach(x => x.classList.toggle('active', +x.dataset.star <= 5));
}

function updateReviewButton(logged) {
  const btn = $('#openReviewBtn');
  if (!btn) return;
  if (logged) {
    btn.textContent = 'Написать отзыв';
    btn.onclick = () => { $('#revForm').classList.toggle('open'); };
  } else {
    btn.textContent = 'Войдите, чтобы оставить отзыв';
    btn.onclick = () => openAuth('login');
  }
}

$('#revForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!currentUser) { openAuth('login'); return; }
  const btn = $('#revSubmit');
  const text = $('#revText').value.trim();
  if (text.length < 5) { toast('Отзыв слишком короткий', 'error'); return; }
  
  btn.disabled = true; btn.textContent = 'Публикую...';
  
  try {
    let photoUrl = '';
    const fileInput = $('#revPhoto');
    if (fileInput && fileInput.files.length > 0) {
      const file = fileInput.files[0];
      btn.textContent = 'Загружаю фото...';
      const storageRef = ref(storage, `reviews/${currentUser.uid}_${Date.now()}_${file.name}`);
      await uploadBytes(storageRef, file);
      photoUrl = await getDownloadURL(storageRef);
    }

    btn.textContent = 'Сохраняю...';
    const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
    const userData = userDoc.exists() ? userDoc.data() : {};
    
    await addDoc(collection(db, 'reviews'), {
      userId: currentUser.uid,
      userName: currentUser.displayName || userData.name || currentUser.email.split('@')[0],
      userCity: userData.city || '',
      text: text,
      rating: selectedStars,
      photoUrl: photoUrl,
      createdAt: serverTimestamp()
    });
    
    $('#revText').value = '';
    if (fileInput) fileInput.value = '';
    $('#revForm').classList.remove('open');
    toast('Спасибо за отзыв! ❤️', 'success');
  } catch (err) {
    toast('Ошибка: ' + err.message, 'error');
  } finally { btn.disabled = false; btn.textContent = 'Опубликовать отзыв'; }
});

const orderForm = $('#orderForm');
if (orderForm) {
  orderForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!currentUser) {
      toast('Для заказа нужно войти в аккаунт!', 'error');
      openAuth('login');
      return;
    }
    const btn = $('#orderSubmit');
    btn.disabled = true; btn.textContent = 'Отправляю...';
    try {
      await addDoc(collection(db, 'orders'), {
        name: $('#orderName').value.trim(),
        phone: $('#orderPhone').value.trim(),
        city: $('#orderCity').value.trim(),
        contact: $('#orderContact').value,
        date: $('#orderDate').value.trim(),
        qty: $('#orderQty').value.trim(),
        color: $('#orderColor').value.trim(),
        comment: $('#orderComment').value.trim(),
        consent: $('#orderConsent').checked,
        createdAt: serverTimestamp(),
        userId: currentUser ? currentUser.uid : null
      });
      toast('Заявка отправлена! Я свяжусь с вами лично 🌹', 'success');
      orderForm.reset();
      btn.textContent = 'Отправлено ✓';
      setTimeout(() => { btn.textContent = 'Отправить заявку'; btn.disabled = false; }, 3000);
    } catch (err) {
      console.error('Firestore save error:', err);
      toast('Ошибка отправки. Напишите мне в чат или позвоните.', 'error');
      btn.textContent = 'Отправить заявку';
      btn.disabled = false;
    }
  });
}

let chatUnsub = null;
function renderChat() {
  const box = $('#chatContent');
  if (!box) return;
  if (!currentUser) {
    box.innerHTML = `<div class="chat-locked"><h3>Войдите, чтобы написать</h3><p>Нужна бесплатная регистрация — 30 секунд</p><button class="btn btn-primary" id="chatLoginBtn2">Войти / Регистрация</button></div>`;
    $('#chatLoginBtn2').addEventListener('click', () => openAuth('login'));
    if (chatUnsub) { chatUnsub(); chatUnsub = null; }
    return;
  }
  if (chatUnsub) { chatUnsub(); chatUnsub = null; }
  box.innerHTML = `
    <div class="chat-body" id="chatBody"><div style="text-align:center;color:var(--muted);font-style:italic;font-size:.88rem;padding:20px;">Загружаю сообщения...</div></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Напишите сообщение..." maxlength="500">
      <button class="chat-send" id="chatSend">Отправить</button>
    </div>
  `;
  const body = $('#chatBody');
  const input = $('#chatInput');
  const send = $('#chatSend');
  const qc = query(collection(db, 'chats', currentUser.uid, 'messages'), orderBy('createdAt', 'asc'));
  chatUnsub = onSnapshot(qc, (snap) => {
    if (snap.empty) {
      body.innerHTML = '<div style="text-align:center;color:var(--muted);font-style:italic;padding:40px 20px;font-size:.88rem;">Пока нет сообщений. Напишите первым 👋<br><br><span style="font-size:.8rem;color:var(--accent);font-style:normal;">💳 Напоминаем: предоплата 50% для запуска заказа</span></div>';
      return;
    }
    body.innerHTML = snap.docs.map(d => {
      const m = d.data();
      const isMine = m.userId === currentUser.uid;
      const isFromAdmin = m.isAdmin === true;
      const cls = isFromAdmin ? 'msg-other msg-admin' : (isMine ? 'msg-mine' : 'msg-other');
      const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : '';
      const text = (m.text || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const label = isFromAdmin ? '<span style="font-size:.7rem;opacity:.85;display:block;margin-bottom:4px;">🌹 ATELIER ROSE</span>' : '';
      return `<div class="msg ${cls}">${label}${text}<span class="msg-time">${time}</span></div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;
  }, (err) => {
    console.error(err);
    body.innerHTML = '<div style="text-align:center;color:var(--error);padding:30px;">Ошибка загрузки.</div>';
  });
  async function sendMsg() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send.disabled = true;
    try {
      await addDoc(collection(db, 'chats', currentUser.uid, 'messages'), {
        userId: currentUser.uid,
        userName: currentUser.displayName || 'Клиент',
        isAdmin: false,
        text: text,
        createdAt: serverTimestamp()
      });
    } catch (err) {
      toast('Не удалось: ' + err.message, 'error');
    } finally { send.disabled = false; input.focus(); }
  }
  send.addEventListener('click', sendMsg);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
}

let adminChatsUnsub = null;
let adminOrdersUnsub = null;
let selectedChatUserId = null;
let currentChatUnsub = null;
let allAdminMessages = [];
let lastOrderCount = 0;
let ordersInitialized = false;

$$('.admin-tab').forEach(tab => tab.addEventListener('click', () => {
  $$('.admin-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  $$('.admin-panel').forEach(p => p.classList.remove('active'));
  $('#panel-' + tab.dataset.atab).classList.add('active');
  const chatView = document.getElementById('adminChatView');
  if (chatView) chatView.classList.remove('mobile-open');
}));

function loadAdminPanel() {
  if (!isAdmin) return;
  loadAdminChats();
  loadAdminOrders();
  renderAdminReviews();
  renderAdminBouquets();
}

let allUserChats = [];

function loadAdminChats() {
  const qChats = collectionGroup(db, 'messages');
  if (adminChatsUnsub) adminChatsUnsub();
  adminChatsUnsub = onSnapshot(qChats, (snap) => {
    allAdminMessages = snap.docs.map(d => {
      const msg = d.data();
      const userId = d.ref.parent.parent ? d.ref.parent.parent.id : null;
      return { id: d.id, userId, ...msg };
    }).filter(m => m.userId);
    const chatsMap = {};
    allAdminMessages.forEach(msg => {
      if (!chatsMap[msg.userId]) {
        chatsMap[msg.userId] = { userId: msg.userId, userName: msg.userName || 'Клиент', lastMsg: '', lastTime: 0, count: 0 };
      }
      const t = msg.createdAt?.toMillis?.() || 0;
      if (t >= chatsMap[msg.userId].lastTime) {
        chatsMap[msg.userId].lastMsg = msg.text || '';
        chatsMap[msg.userId].lastTime = t;
        if (msg.userName) chatsMap[msg.userId].userName = msg.userName;
      }
      chatsMap[msg.userId].count++;
    });
    allUserChats = Object.values(chatsMap).sort((a, b) => b.lastTime - a.lastTime);
    renderAdminChatList();
    if ($('#statChats')) $('#statChats').textContent = allUserChats.length;
  }, (err) => {
    console.error('Chats load error:', err);
    if ($('#adminChatList')) $('#adminChatList').innerHTML = '<div class="admin-empty" style="color:var(--error);">Ошибка загрузки.</div>';
  });
}

function renderAdminChatList() {
  const list = $('#adminChatList');
  if (!list) return;
  if (allUserChats.length === 0) {
    list.innerHTML = '<div class="admin-empty">Пока нет диалогов</div>';
    return;
  }
  list.innerHTML = allUserChats.map(c => `
    <div class="admin-chat-item ${c.userId === selectedChatUserId ? 'active' : ''}" data-uid="${c.userId}">
      <b>${(c.userName || 'Клиент').replace(/</g,'&lt;')}</b>
      <span>${(c.lastMsg || '').replace(/</g,'&lt;').substring(0, 50)}</span>
    </div>
  `).join('');
  list.querySelectorAll('.admin-chat-item').forEach(item => {
    item.addEventListener('click', () => openAdminChat(item.dataset.uid));
  });
}

function openAdminChat(userId) {
  selectedChatUserId = userId;
  renderAdminChatList();
  const chat = allUserChats.find(c => c.userId === userId);
  const view = $('#adminChatView');
  if (!view) return;
  view.innerHTML = `
    <div class="admin-chat-view-header">
      <button class="admin-back-btn" id="adminBackBtn" aria-label="К списку чатов">←</button>
      <div style="flex:1;min-width:0;">
        <b>${(chat?.userName || 'Клиент').replace(/</g,'&lt;')}</b>
        <span>ID: ${userId}</span>
      </div>
    </div>
    <div class="admin-chat-messages" id="adminChatMessages"></div>
    <div class="admin-chat-input">
      <input type="text" id="adminChatInput" placeholder="Ответить клиенту..." maxlength="500">
      <button id="adminChatSend">Отправить</button>
    </div>
  `;
  if (window.innerWidth <= 620) {
    view.classList.add('mobile-open');
    document.body.style.overflow = 'hidden';
  }
  $('#adminBackBtn').addEventListener('click', () => {
    view.classList.remove('mobile-open');
    document.body.style.overflow = '';
    selectedChatUserId = null;
    renderAdminChatList();
  });
  const messages = $('#adminChatMessages');
  if (currentChatUnsub) currentChatUnsub();
  const qc = query(collection(db, 'chats', userId, 'messages'), orderBy('createdAt', 'asc'));
  currentChatUnsub = onSnapshot(qc, (snap) => {
    if (snap.empty) {
      messages.innerHTML = '<div style="text-align:center;color:var(--muted);font-style:italic;padding:30px;font-size:.88rem;">Сообщений нет</div>';
      return;
    }
    messages.innerHTML = snap.docs.map(d => {
      const m = d.data();
      const isFromAdmin = m.isAdmin === true;
      const cls = isFromAdmin ? 'msg-mine' : 'msg-other';
      const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
      const text = (m.text || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const label = isFromAdmin ? '<span style="font-size:.7rem;opacity:.85;display:block;margin-bottom:4px;">🌹 Вы</span>' : '<span style="font-size:.7rem;opacity:.85;display:block;margin-bottom:4px;">👤 Клиент</span>';
      return `<div class="msg ${cls}">${label}${text}<span class="msg-time">${time}</span></div>`;
    }).join('');
    messages.scrollTop = messages.scrollHeight;
  });
  const input = $('#adminChatInput');
  const send = $('#adminChatSend');
  async function adminSend() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send.disabled = true;
    try {
      await addDoc(collection(db, 'chats', userId, 'messages'), {
        userId: userId,
        userName: 'ATELIER ROSE',
        isAdmin: true,
        text: text,
        createdAt: serverTimestamp()
      });
    } catch (err) {
      toast('Ошибка: ' + err.message, 'error');
    } finally { send.disabled = false; input.focus(); }
  }
  send.addEventListener('click', adminSend);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') adminSend(); });
}

function loadAdminOrders() {
  const qOrders = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
  if (adminOrdersUnsub) adminOrdersUnsub();
  adminOrdersUnsub = onSnapshot(qOrders, (snap) => {
    const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAdminOrders(orders);
    if ($('#statOrders')) $('#statOrders').textContent = orders.length;
    const badge = $('#adminBadge');
    const badgeMobile = $('#adminBadgeMobile');
    if (orders.length > 0) {
      if (badge) { badge.style.display = 'inline-block'; badge.textContent = orders.length; }
      if (badgeMobile) { badgeMobile.style.display = 'inline-block'; badgeMobile.textContent = orders.length; }
    } else {
      if (badge) badge.style.display = 'none';
      if (badgeMobile) badgeMobile.style.display = 'none';
    }
    if (ordersInitialized && orders.length > lastOrderCount && isAdmin) {
      try {
        const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        audio.play().catch(()=>{});
      } catch(e){}
      toast('🔔 Новая заявка!', 'success');
    }
    lastOrderCount = orders.length;
    ordersInitialized = true;
  }, (err) => {
    console.error('Orders load error:', err);
    if ($('#adminOrders')) $('#adminOrders').innerHTML = '<div class="admin-empty" style="color:var(--error);">Ошибка загрузки заявок.</div>';
  });
}

function renderAdminOrders(orders) {
  const box = $('#adminOrders');
  if (!box) return;
  if (orders.length === 0) {
    box.innerHTML = '<div class="admin-empty">Пока нет заявок</div>';
    return;
  }
  box.innerHTML = orders.map(o => {
    const date = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString('ru-RU') : '';
    return `<div class="admin-order" data-id="${o.id}">
      <div class="admin-order-header">
        <h4>🌹 ${(o.name || 'Без имени').replace(/</g,'&lt;')}</h4>
        <span>${date}</span>
      </div>
      <div class="admin-order-info">
        <div><b>Телефон</b>${(o.phone || '—').replace(/</g,'&lt;')}</div>
        <div><b>Способ связи</b>${(o.contact || '—').replace(/</g,'&lt;')}</div>
        <div><b>Город</b>${(o.city || '—').replace(/</g,'&lt;')}</div>
        <div><b>Дата события</b>${(o.date || '—').replace(/</g,'&lt;')}</div>
        <div><b>Количество роз</b>${(o.qty || '—').replace(/</g,'&lt;')}</div>
        <div><b>Оттенок</b>${(o.color || '—').replace(/</g,'&lt;')}</div>
        <div><b>Предоплата</b>50% · остаток при получении</div>
      </div>
      ${o.comment ? `<div style="margin-top:14px;padding:14px;background:var(--bg-alt);border-radius:12px;font-size:.88rem;font-weight:300;"><b style="display:block;font-size:.7rem;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;margin-bottom:4px;">Комментарий</b>${o.comment.replace(/</g,'&lt;')}</div>` : ''}
      <div class="admin-order-actions">
        <a href="tel:${(o.phone || '').replace(/[^0-9+]/g,'')}">📞 Позвонить</a>
        <a href="https://wa.me/${(o.phone || '').replace(/[^0-9]/g,'')}" target="_blank">💬 WhatsApp</a>
        <button class="btn-danger admin-order-del">🗑 Удалить</button>
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('.admin-order-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.closest('.admin-order').dataset.id;
      if (!confirm('Удалить заявку?')) return;
      try {
        await deleteDoc(doc(db, 'orders', id));
        toast('Заявка удалена', 'success');
      } catch (err) { toast('Ошибка: ' + err.message, 'error'); }
    });
  });
}

function renderAdminReviews() {
  const box = $('#adminReviews');
  if (!box) return;
  if (allReviews.length === 0) {
    box.innerHTML = '<div class="admin-empty">Пока нет отзывов</div>';
    return;
  }
  box.innerHTML = allReviews.map(r => {
    const date = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleString('ru-RU') : '';
    return `<div class="admin-review" data-id="${r.id}">
      <div class="admin-review-header">
        <b>${(r.userName || 'Клиент').replace(/</g,'&lt;')} · ${(r.userCity || '—').replace(/</g,'&lt;')}</b>
        <span>${date}</span>
      </div>
      <div class="admin-review-stars">${starsHtml(r.rating || 5)}</div>
      <p>${(r.text || '').replace(/</g,'&lt;')}</p>
      <button class="admin-review-del">🗑 Удалить отзыв</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.admin-review-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.closest('.admin-review').dataset.id;
      if (!confirm('Удалить отзыв?')) return;
      try {
        await deleteDoc(doc(db, 'reviews', id));
        toast('Отзыв удалён', 'success');
      } catch (err) { toast('Ошибка: ' + err.message, 'error'); }
    });
  });
}

let observer = null;
function observeReveals() {
  if (observer) observer.disconnect();
  if (!('IntersectionObserver' in window)) {
    $$('.page.active .reveal').forEach(el => el.classList.add('in'));
    return;
  }
  observer = new IntersectionObserver(entries => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('in'), (i % 4) * 80);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  $$('.page.active .reveal').forEach(el => observer.observe(el));
}

route();
observeReveals();
</script>
